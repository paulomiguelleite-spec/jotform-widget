<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 5px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    color: #2c3345;
    background: transparent;
}

.global-box {
    margin-bottom: 18px;
}

.global-box label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}

.global-box input {
    width: 180px;
}

.header,
.row {
    display: grid;
    grid-template-columns: 1.3fr 0.7fr 1fr 45px;
    gap: 10px;
    align-items: center;
}

.header {
    margin-bottom: 7px;
    color: #57647e;
    font-size: 13px;
    font-weight: 600;
}

.row {
    margin-bottom: 10px;
}

input {
    width: 100%;
    min-height: 40px;
    padding: 8px 10px;
    border: 1px solid #c3cad8;
    border-radius: 4px;
    font: inherit;
    background: white;
}

input:focus {
    outline: none;
    border-color: #2e69ff;
    box-shadow: 0 0 0 2px rgba(46,105,255,.15);
}

.add-button,
.remove-button {
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
}

.add-button {
    margin-top: 3px;
    padding: 10px 14px;
    background: #2e69ff;
    color: white;
    font-weight: 600;
}

.remove-button {
    min-height: 40px;
    background: #fee4e2;
    color: #b42318;
    font-size: 20px;
}

.summary {
    margin-top: 15px;
    padding: 12px;
    border-radius: 5px;
    line-height: 1.5;
}

.summary.neutral {
    border: 1px solid #d5d9e2;
    background: #f7f8fa;
    color: #57647e;
}

.summary.valid {
    border: 1px solid #75c48b;
    background: #edf9f0;
    color: #176b35;
}

.summary.invalid {
    border: 1px solid #f0a6a1;
    background: #fff2f1;
    color: #a1261d;
}

@media (max-width: 620px) {
    .header { display: none; }

    .row {
        grid-template-columns: 1fr 1fr 42px;
        padding: 10px;
        border: 1px solid #d5d9e2;
        border-radius: 5px;
    }

    .invoice {
        grid-column: 1 / 3;
    }

    .remove-button {
        grid-column: 3;
        grid-row: 1 / 3;
        height: 100%;
    }
}
</style>
</head>

<body>

<div class="global-box">
    <label for="globalQuantity">
        Quantidade a devolver
    </label>

    <input
        id="globalQuantity"
        type="number"
        min="1"
        step="1"
        placeholder="Quantidade"
        inputmode="numeric"
    >
</div>

<div class="header">
    <div>N.º da fatura</div>
    <div>Quantidade</div>
    <div>Lote</div>
    <div></div>
</div>

<div id="rows"></div>

<button
    id="addRow"
    type="button"
    class="add-button"
>
    + Adicionar fatura/lote
</button>

<div id="summary" class="summary neutral">
    Introduza a quantidade a devolver.
</div>

<script>
const globalInput = document.getElementById("globalQuantity");
const rowsContainer = document.getElementById("rows");
const addButton = document.getElementById("addRow");
const summary = document.getElementById("summary");

function number(value) {
    const n = Number(
        String(value || "").replace(",", ".")
    );

    return Number.isFinite(n) ? n : 0;
}

function createRow() {
    const row = document.createElement("div");
    row.className = "row";

    row.innerHTML = `
        <input
            type="text"
            class="invoice"
            placeholder="N.º da fatura"
            aria-label="N.º da fatura"
        >

        <input
            type="number"
            class="quantity"
            min="1"
            step="1"
            placeholder="Quantidade"
            aria-label="Quantidade"
            inputmode="numeric"
        >

        <input
            type="text"
            class="batch"
            placeholder="Lote"
            aria-label="Lote"
        >

        <button
            type="button"
            class="remove-button"
            title="Remover linha"
            aria-label="Remover linha"
        >
            ×
        </button>
    `;

    row.querySelectorAll("input").forEach(input => {
        input.addEventListener("input", validate);
    });

    row.querySelector(".remove-button")
        .addEventListener("click", () => {

            row.remove();

            if (!rowsContainer.children.length) {
                createRow();
            }

            validate();
            resize();
        });

    rowsContainer.appendChild(row);

    resize();
}

function getRows() {
    return [...rowsContainer.querySelectorAll(".row")]
        .map(row => ({
            fatura:
                row.querySelector(".invoice").value.trim(),

            quantidade:
                number(
                    row.querySelector(".quantity").value
                ),

            lote:
                row.querySelector(".batch").value.trim()
        }))
        .filter(row =>
            row.fatura ||
            row.quantidade ||
            row.lote
        );
}

function validate() {

    const global = number(globalInput.value);
    const rows = getRows();

    const total = rows.reduce(
        (sum, row) => sum + row.quantidade,
        0
    );

    if (global <= 0) {

        summary.className = "summary neutral";
        summary.textContent =
            "Introduza a quantidade a devolver.";

        resize();

        return {
            valid: false,
            total: total
        };
    }

    const incomplete = rows.some(row =>
        !row.fatura ||
        row.quantidade <= 0 ||
        !row.lote
    );

    if (!rows.length || incomplete) {

        summary.className = "summary invalid";

        summary.textContent =
            "Preencha a fatura, a quantidade e o lote.";

        resize();

        return {
            valid: false,
            total: total
        };
    }

    const difference = global - total;

    if (difference > 0) {

        summary.className = "summary invalid";

        summary.textContent =
            "Faltam discriminar " +
            difference +
            " unidade(s). Total discriminado: " +
            total +
            " de " +
            global +
            ".";

        resize();

        return {
            valid: false,
            total: total
        };
    }

    if (difference < 0) {

        summary.className = "summary invalid";

        summary.textContent =
            "A quantidade discriminada excede em " +
            Math.abs(difference) +
            " unidade(s) a quantidade indicada. " +
            "Total discriminado: " +
            total +
            " de " +
            global +
            ".";

        resize();

        return {
            valid: false,
            total: total
        };
    }

    summary.className = "summary valid";

    summary.textContent =
        "Quantidade totalmente discriminada: " +
        total +
        " de " +
        global +
        ".";

    resize();

    return {
        valid: true,
        total: total
    };
}

function getValue() {

    const result = validate();

    return JSON.stringify({
        quantidadeGlobal:
            number(globalInput.value),

        quantidadeDiscriminada:
            result.total,

        detalhe:
            getRows()
    });
}

function resize() {

    setTimeout(() => {

        if (
            window.JFCustomWidget &&
            typeof JFCustomWidget.requestFrameResize
                === "function"
        ) {
            JFCustomWidget.requestFrameResize({
                height:
                    document.documentElement.scrollHeight + 15
            });
        }

    }, 50);
}

globalInput.addEventListener("input", validate);

addButton.addEventListener("click", () => {
    createRow();
    validate();
});

//
// IMPORTANTE:
// Criamos imediatamente a primeira linha.
// Não dependemos do evento "ready" do Jotform.
//
createRow();
validate();

if (window.JFCustomWidget) {

    JFCustomWidget.subscribe("ready", function() {
        resize();
    });

    JFCustomWidget.subscribe("submit", function() {

        const result = validate();

        JFCustomWidget.sendSubmit({
            valid: result.valid,
            value: getValue()
        });

    });
}
</script>

</body>
</html>
