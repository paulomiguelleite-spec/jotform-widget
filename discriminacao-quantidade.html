<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px 2px;
      color: #2c3345;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      background: transparent;
    }

    .header,
    .row {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr 1fr 42px;
      gap: 10px;
      align-items: center;
    }

    .header {
      margin-bottom: 6px;
      color: #57647e;
      font-size: 13px;
      font-weight: 600;
    }

    .row {
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #c3cad8;
      border-radius: 4px;
      color: #2c3345;
      font: inherit;
      background: #fff;
    }

    input:focus {
      border-color: #2e69ff;
      outline: none;
      box-shadow: 0 0 0 2px rgba(46, 105, 255, 0.15);
    }

    .remove-button,
    .add-button {
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
    }

    .remove-button {
      width: 40px;
      min-height: 40px;
      color: #b42318;
      font-size: 20px;
      background: #fee4e2;
    }

    .add-button {
      margin-top: 2px;
      padding: 10px 14px;
      color: #fff;
      font-weight: 600;
      background: #2e69ff;
    }

    .summary {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid #d5d9e2;
      border-radius: 5px;
      line-height: 1.5;
      background: #f7f8fa;
    }

    .summary.valid {
      border-color: #75c48b;
      color: #176b35;
      background: #edf9f0;
    }

    .summary.invalid {
      border-color: #f0a6a1;
      color: #a1261d;
      background: #fff2f1;
    }

    .summary.neutral {
      color: #57647e;
    }

    @media (max-width: 620px) {
      .header {
        display: none;
      }

      .row {
        grid-template-columns: 1fr 1fr 42px;
        padding: 12px;
        border: 1px solid #d5d9e2;
        border-radius: 5px;
      }

      .invoice {
        grid-column: 1 / 3;
      }

      .remove-button {
        grid-column: 3;
        grid-row: 1 / 3;
        align-self: stretch;
        height: 100%;
      }

      input::placeholder {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div>N.º da fatura</div>
    <div>Quantidade</div>
    <div>Lote</div>
    <div></div>
  </div>

  <div id="rows"></div>

  <button
    type="button"
    id="addRow"
    class="add-button"
  >
    + Adicionar fatura/lote
  </button>

  <div id="summary" class="summary neutral">
    Introduza a quantidade global e discrimine as unidades.
  </div>

  <script>
    let globalQuantity = 0;

    const rowsContainer = document.getElementById("rows");
    const summary = document.getElementById("summary");
    const addRowButton = document.getElementById("addRow");

    function parseNumber(value) {
      const normalized = String(value ?? "")
        .trim()
        .replace(",", ".");

      const number = Number(normalized);

      return Number.isFinite(number) ? number : 0;
    }

    function createRow(data = {}) {
      const row = document.createElement("div");
      row.className = "row";

      row.innerHTML = `
        <input
          type="text"
          class="invoice"
          aria-label="N.º da fatura"
          placeholder="N.º da fatura"
          value="${escapeHtml(data.invoice || "")}"
        >

        <input
          type="number"
          class="quantity"
          aria-label="Quantidade"
          placeholder="Quantidade"
          min="1"
          step="1"
          inputmode="numeric"
          value="${escapeHtml(data.quantity || "")}"
        >

        <input
          type="text"
          class="batch"
          aria-label="Lote"
          placeholder="Lote"
          value="${escapeHtml(data.batch || "")}"
        >

        <button
          type="button"
          class="remove-button"
          aria-label="Remover linha"
          title="Remover linha"
        >
          ×
        </button>
      `;

      row
        .querySelectorAll("input")
        .forEach((input) => {
          input.addEventListener("input", validate);
          input.addEventListener("change", validate);
        });

      row
        .querySelector(".remove-button")
        .addEventListener("click", () => {
          row.remove();

          if (!rowsContainer.children.length) {
            createRow();
          }

          validate();
          resizeWidget();
        });

      rowsContainer.appendChild(row);
      validate();
      resizeWidget();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getRows() {
      return [...rowsContainer.querySelectorAll(".row")]
        .map((row) => ({
          invoice: row.querySelector(".invoice").value.trim(),
          quantity: parseNumber(
            row.querySelector(".quantity").value
          ),
          batch: row.querySelector(".batch").value.trim()
        }))
        .filter((row) =>
          row.invoice ||
          row.quantity > 0 ||
          row.batch
        );
    }

    function getDiscriminatedTotal() {
      return getRows().reduce(
        (total, row) => total + row.quantity,
        0
      );
    }

    function rowsAreComplete(rows) {
      if (!rows.length) {
        return false;
      }

      return rows.every((row) =>
        row.invoice &&
        row.quantity > 0 &&
        row.batch
      );
    }

    function getValidation() {
      const rows = getRows();
      const total = getDiscriminatedTotal();
      const difference = globalQuantity - total;
      const complete = rowsAreComplete(rows);

      if (globalQuantity <= 0) {
        return {
          valid: true,
          total,
          message:
            "Não existe quantidade a discriminar."
        };
      }

      if (!complete) {
        return {
          valid: false,
          total,
          message:
            "Preencha a fatura, a quantidade e o lote em todas as linhas."
        };
      }

      if (difference > 0) {
        return {
          valid: false,
          total,
          message:
            `Faltam discriminar ${difference} unidade(s). ` +
            `Total discriminado: ${total} de ${globalQuantity}.`
        };
      }

      if (difference < 0) {
        return {
          valid: false,
          total,
          message:
            `Foram discriminadas ${Math.abs(difference)} ` +
            `unidade(s) a mais. Total discriminado: ` +
            `${total} de ${globalQuantity}.`
        };
      }

      return {
        valid: true,
        total,
        message:
          `Quantidade totalmente discriminada: ` +
          `${total} de ${globalQuantity}.`
      };
    }

    function validate() {
      const result = getValidation();

      summary.textContent = result.message;
      summary.className =
        `summary ${result.valid ? "valid" : "invalid"}`;

      resizeWidget();
      return result;
    }

    function serializeValue() {
      const result = getValidation();

      return JSON.stringify({
        quantidadeGlobal: globalQuantity,
        quantidadeDiscriminada: result.total,
        linhas: getRows()
      });
    }

    function resizeWidget() {
      window.setTimeout(() => {
        if (
          window.JFCustomWidget &&
          typeof JFCustomWidget.requestFrameResize === "function"
        ) {
          JFCustomWidget.requestFrameResize({
            height: document.documentElement.scrollHeight + 10
          });
        }
      }, 50);
    }

    addRowButton.addEventListener("click", () => {
      createRow();
    });

    JFCustomWidget.subscribe("ready", () => {
      /*
       * A quantidade global é recebida pelas definições do widget.
       * Exemplo: 25
       */
      globalQuantity = parseNumber(
        JFCustomWidget.getWidgetSetting("QuantidadeGlobal")
      );

      createRow();
      validate();
      resizeWidget();
    });

    JFCustomWidget.subscribe("submit", () => {
      const result = validate();

      JFCustomWidget.sendSubmit({
        valid: result.valid,
        value: serializeValue()
      });
    });
  </script>
</body>
</html>
